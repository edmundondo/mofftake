<div class="wrap">
  <section class="hero">
  <header>
    <div class="eyebrow">WhatsApp Group → Project Tracker</div>
    <h1>Mak</h1>
    <div class="subtitle">3 groups, read as 3 live projects · last synced from chat exports 8/19/26</div>
    <div class="print-meta" id="print-meta"></div>
  </header>
  </section>

  <section class="overview">
  <div class="stats" id="stats"></div>

  <div class="top-row">
    <div class="donut-block" id="donut-block"></div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search projects, tasks, or owners…" oninput="onSearch(this.value)">
    </div>
    <button class="pdf-btn" onclick="exportPDF()">📄 Export PDF Report</button>
    <button class="csv-btn" onclick="exportCSV()">📊 Export Excel (CSV)</button>
    <button class="epub-btn" onclick="exportEPUB()">📚 Export EPUB</button>
    <button class="sync-btn" onclick="loadRemoteNotes()">🔄 Sync Reviewer Notes</button>
  </div>

  <div class="filters" id="filters"></div>

  </section>

  <section class="tasks">
  <div class="grid" id="grid"></div>
  </section>

  <footer>Click a project row to expand · click any status pill to cycle done → in progress → not started · search and filter above</footer>

<style>
  :root {
    --bg: #C9D0DF;
    --panel: #C9D0DF;
    --panel-hover: #BBC4D7;
    --line: #14171C;
    --text: #000000;
    --text-dim: #1A1D24;
    --gold: #D4A017;
    --gold-ink: #6E4E05;
    --gold-soft: rgba(212,160,23,0.16);
    --green: #01AA47;
    --green-ink: #0F6138;
    --yellow: #FFC000;
    --yellow-ink: #754A00;
    --red: #DC143C;
    --red-ink: #A61930;
    --high: #C2410C;
    --badge-bg: #1B1D23;
    --badge-border: #2A2D35;
    --badge-icon-bg: linear-gradient(135deg, #6C5CE7, #341F97);
    --badge-icon-text: #FFFFFF;
    --badge-text: #B7BAC4;
    --badge-brand: #FFFFFF;
    --badge-font: system-ui, -apple-system, Segoe UI, sans-serif;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    margin: 22px auto 0;
    background: var(--badge-bg);
    border: 1px solid var(--badge-border);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  .status-badge-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--badge-icon-bg);
    color: var(--badge-icon-text);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .status-badge-text {
    font-family: var(--badge-font);
    font-size: 12px;
    color: var(--badge-text);
    white-space: nowrap;
  }
  .status-badge-brand { font-weight: 700; color: var(--badge-brand); }
  @media (max-width: 720px) {
    .status-badge { margin-top: 16px; padding: 5px 12px 5px 5px; }
    .status-badge-text { font-size: 11px; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    padding: 32px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold-ink);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .subtitle { color: var(--text-dim); font-size: 14px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin: 26px 0 34px;
  }
  .stat { background: var(--panel); padding: 16px 18px; }
  .stat .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .stat .lbl {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 6px;
  }
  .stat.done { background: var(--green); }
  .stat.done .num { color: #0B2116; }
  .stat.done .lbl { color: #0B2116; opacity: 0.75; }
  .stat.progress { background: var(--yellow); }
  .stat.progress .num { color: #1F1600; }
  .stat.progress .lbl { color: #1F1600; opacity: 0.75; }
  .stat.notstarted { background: var(--red); }
  .stat.notstarted .num { color: #FFFFFF; }
  .stat.notstarted .lbl { color: #FFFFFF; opacity: 0.85; }

  .top-row {
    display: flex;
    gap: 24px;
    align-items: center;
    margin: 26px 0 22px;
    flex-wrap: wrap;
  }
  .donut-block { display: flex; align-items: center; gap: 14px; }
  .donut-legend { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-dim); }
  .donut-legend span.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  .search-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 13.5px;
    padding: 10px 14px 10px 34px;
  }
  .search-wrap input:focus { outline: none; border-color: var(--gold); }
  .search-wrap input::placeholder { color: var(--text-dim); opacity: 1; }
  .search-wrap::before {
    content: "⌕";
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 15px;
  }

  .filters { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .filter-btn {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:hover { border-color: var(--gold); color: var(--text); }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #1F1600; font-weight: 700; }

  .grid { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    transition: border-color .15s ease;
  }
  .card.hidden { display: none; }

  .core-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .core-stripe.high { background: var(--high); }
  .core-stripe.medium { background: var(--yellow); }
  .core-stripe.low { background: var(--green); }
  .core-stripe.caution { background: var(--red); }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 18px 26px;
    cursor: pointer;
    gap: 16px;
  }
  .card-head:hover { background: var(--panel-hover); }

  .card-title-block { flex: 1; min-width: 0; }
  .card-title {
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 600;

<script>

    tasks: [

      ["Draft and circulate NDA", "Clarice", "done", "Draft NDA shared 7/28"],
      ["Sign NDA (all parties)", "Eddie Ed / Silas Karambwe", "done", "Their side signed 7/30; Eddie signed and returned 8/4; countersigned copy shared 8/5; witness copies re-circulated through 8/13"],
      ["Share detailed mine info sheet", "Liberty Mabeza", "done", "Swiss Meridian Info Sheet_2.pdf shared 8/6, pending Eddie's witness signature"],
      ["Schedule intro call / move to commercial terms", "Group", "notstarted", "Call plans raised 7/30 and 8/4 but not confirmed held; no term sheet issued as of 8/13"],
    ]
  }
];

function countBy(tasks) {
  const c = { done: 0, progress: 0, notstarted: 0 };
  tasks.forEach(t => c[t[2]]++);
  return c;
}

function overallCounts() {
  let total = 0, done = 0, progress = 0, notstarted = 0;
  PROJECTS.forEach(p => {
    const c = countBy(p.tasks);
    total += p.tasks.length; done += c.done; progress += c.progress; notstarted += c.notstarted;
  });
  return { total, done, progress, notstarted };
}

function renderStats() {
  const { total, done, progress, notstarted } = overallCounts();
  const stats = [
    { num: PROJECTS.length, lbl: "Projects", cls: "" },
    { num: total, lbl: "Total Tasks", cls: "" },
    { num: done, lbl: "Done", cls: "done" },
    { num: progress, lbl: "In Progress", cls: "progress" },
    { num: notstarted, lbl: "Not Started", cls: "notstarted" },
  ];
  document.getElementById("stats").innerHTML = stats.map(s =>
    `<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
  ).join("");
}

function renderDonut() {
  const { total, done, progress, notstarted } = overallCounts();
  const r = 30, circ = 2 * Math.PI * r;
  const dDone = total ? (done/total)*circ : 0;
  const dProg = total ? (progress/total)*circ : 0;
  const dNS = total ? (notstarted/total)*circ : 0;
  let offset = 0;
  const seg = (len, color, off) => `<circle r="${r}" cx="40" cy="40" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 40 40)"/>`;
  const svg = `
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle r="${r}" cx="40" cy="40" fill="none" stroke="#14171C" stroke-width="10"/>
      ${seg(dDone, "#01AA47", offset)}
      ${offset += dDone, seg(dProg, "#FFC000", offset)}
      ${offset += dProg, seg(dNS, "#DC143C", offset)}
      <text x="40" y="45" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#14171C">${total ? Math.round(done/total*100) : 0}%</text>
    </svg>`;
  const legend = `
    <div class="donut-legend">
      <div><span class="sw" style="background:#01AA47"></span>Done — ${done}</div>
      <div><span class="sw" style="background:#FFC000"></span>In Progress — ${progress}</div>
      <div><span class="sw" style="background:#DC143C"></span>Not Started — ${notstarted}</div>
    </div>`;
  document.getElementById("donut-block").innerHTML = svg + legend;
}

let currentFilter = "all";
let searchTerm = "";

function onSearch(v) {
  searchTerm = v.trim().toLowerCase();
  renderGrid();
}

function cycleStatus(projIdx, taskIdx, ev) {
  ev.stopPropagation();
  const order = ["notstarted", "progress", "done"];
  const t = PROJECTS[projIdx].tasks[taskIdx];
  const next = order[(order.indexOf(t[2]) + 1) % order.length];
  t[2] = next;
  renderStats();
  renderDonut();
  renderGrid();
  const card = document.querySelector(`.card[data-idx="${projIdx}"]`);
  if (card) card.classList.add("open");
}

function renderFilters() {
  const opts = [["all","All Projects"],["high","High Priority"],["medium","Medium Priority"],["low","Low Priority"],["caution","⚠ Caution"]];
  document.getElementById("filters").innerHTML = opts.map(([key,label]) =>
    `<button class="filter-btn${key===currentFilter?' active':''}" data-key="${key}">${label}</button>`
  ).join("");
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.key;
      renderFilters();
      renderGrid();
    });
  });
}

function statusLabel(s) {
  return s === "done" ? "Done" : s === "progress" ? "In Progress" : "Not Started";
}

function matchesSearch(p) {
  if (!searchTerm) return true;
  const haystack = [p.name, p.purpose, ...(p.aliases || []), ...p.tasks.flatMap(t => [t[0], t[1], t[3]])]
    .join(" ").toLowerCase();
  return haystack.includes(searchTerm);
}

function renderGrid() {
  const grid = document.getElementById("grid");
  let anyVisible = false;

  grid.innerHTML = PROJECTS.map((p, idx) => {
    const c = countBy(p.tasks);
    const total = p.tasks.length;
    const pct = k => total ? (c[k]/total*100) : 0;
    const passesFilter = currentFilter === "all" || p.priority === currentFilter || (currentFilter === "caution" && p.caution);
    const passesSearch = matchesSearch(p);
    const visible = passesFilter && passesSearch;
    if (visible) anyVisible = true;
    const stripeClass = p.caution ? "caution" : p.priority;

    const rows = p.tasks.map((t, tIdx) => `
      <tr>
        <td class="task-name">${t[0]}</td>
        <td class="task-owner">${t[1]}</td>
        <td><span class="status-pill ${t[2]}" onclick="cycleStatus(${idx},${tIdx},event)" title="Click to change status">${statusLabel(t[2])}</span></td>
        <td class="task-notes">${t[3]}</td>
      </tr>`).join("");

    const cautionBanner = p.caution ? `<div class="caution-banner"><b>⚠ Caution:</b> this group shows patterns commonly seen in advance-fee gold scams — pricing well below LBMA market rates, Proof of Product promised then repeatedly delayed, shifting sellers/refineries, and/or unusual bank-instrument (DLC/BG/blocked-funds) verbiage. Verify independently (KYC, legal review) before any funds, product, or signatures change hands.</div>` : "";

    return `
    <div class="card${visible?'':' hidden'}" data-idx="${idx}">
      <div class="core-stripe ${stripeClass}"></div>
      <div class="card-head" onclick="toggleCard(${idx})">
        <div class="card-title-block">
          <div class="card-title">
            ${p.name}
            <span class="badge ${p.priority}">${p.priority}</span>
            ${p.caution ? '<span class="caution-flag">⚠ review</span>' : ''}
          </div>
          <div class="card-purpose">${p.purpose}</div>
        </div>
        <div class="card-right">
          <div class="progress-block">
            <div class="progress-num"><b>${c.done}</b>/${total} done</div>
            <div class="progress-bar">
              <div class="seg done" style="width:${pct('done')}%"></div>
              <div class="seg progress" style="width:${pct('progress')}%"></div>
              <div class="seg notstarted" style="width:${pct('notstarted')}%"></div>
            </div>
          </div>
          ${p.whatsappLink
            ? `<a class="wa-link" href="${p.whatsappLink}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 Open in WhatsApp</a>`
            : `<span class="wa-link disabled" title="No invite link added yet">🔗 No link yet</span>`}
          <div class="chevron">▶</div>
        </div>
      </div>
      <div class="task-panel">
        <div class="task-panel-inner">
          ${cautionBanner}
          <table>
            <thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Notes</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="notes-section">
            <div class="notes-header">💬 Reviewer Notes</div>
            <div class="notes-list" id="notes-list-${idx}">${renderNotesHTML(p.notes)}</div>
            <div class="notes-form">
              <a class="form-link" href="${FORM_URL}" target="_blank" rel="noopener noreferrer">📝 Add a note via Google Form</a>
              <div class="form-hint">Type exactly this in the Project field: <code>${p.name}</code></div>
              <div class="edit-hint">Made a mistake? After submitting, Google Forms shows an "Edit your response" link on the confirmation page — use that to fix or update your note instead of resubmitting.</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join("") + (anyVisible ? "" : `<div class="no-results">No projects match "${searchTerm}" with the current filter.</div>`);
}

function toggleCard(idx) {
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  card.classList.toggle("open");
}

function renderNotesHTML(notes) {
  if (!notes || notes.length === 0) {
    return `<div class="no-notes">No reviewer notes yet — be the first to add one.</div>`;
  }
  return notes.map(n => {
    let ndaBadge = "";
    if (n.nda) {
      const isYes = n.nda.toLowerCase().startsWith("y");
      ndaBadge = `<span class="nda-badge ${isYes ? 'nda-yes' : 'nda-no'}">NDA: ${isYes ? '✓ Signed' : '✗ Not signed'}</span>`;
    }
    return `
    <div class="note-item">
      <div class="note-avatar">${n.author.trim().charAt(0).toUpperCase()}</div>
      <div class="note-body">
        <div class="note-meta"><b>${n.author}</b> · ${n.date}${n.example ? '<span class="example-tag">Example</span>' : ''} ${ndaBadge}</div>
        <div class="note-text">${n.text}</div>
      </div>
    </div>`;
  }).join("");
}

function formatDateMDY(raw) {
  if (!raw) return "";
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw; // couldn't parse — show whatever was there rather than break
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const yyyy = d.getFullYear();
  return `${mm}/${dd}/${yyyy}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function loadRemoteNotes() {
  fetchNotesCSV()
    .then(text => {
      const rows = parseCSV(text);
      if (rows.length < 2) return;
      const header = rows[0].map(h => h.trim().toLowerCase());
      const iProject = header.indexOf("project");
      const iReviewer = header.indexOf("reviewer");
      const iDate = header.indexOf("date");
      const iNote = header.indexOf("note");
      const iEmail = header.findIndex(h => h.includes("email"));
      const iPhone = header.findIndex(h => h.includes("phone"));
      const iNda = header.findIndex(h => h.includes("nda"));
      if (iProject === -1) return;
      PROJECTS.forEach(p => { p.notes = []; });
      rows.slice(1).forEach(r => {
        const projVal = (r[iProject] || "").trim();
        if (!projVal) return;
        const match = PROJECTS.find(p => {
          const candidates = [p.name, ...(p.aliases || [])];
          return candidates.some(name =>
            name.toLowerCase().includes(projVal.toLowerCase()) ||
            projVal.toLowerCase().includes(name.toLowerCase())
          );
        });
        if (!match) return;
        match.notes.push({
          author: (r[iReviewer] || "Anonymous").trim(),
          date: formatDateMDY((r[iDate] || "").trim()),
          text: (r[iNote] || "").trim(),
          email: iEmail > -1 ? (r[iEmail] || "").trim() : "",
          phone: iPhone > -1 ? (r[iPhone] || "").trim() : "",
          nda: iNda > -1 ? (r[iNda] || "").trim() : ""
        });
      });
      renderGrid();
    })
    .catch(err => console.warn("Could not load reviewer notes:", err));
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV() {
  const rows = [["Project", "Priority", "Task", "Owner", "Status", "Task Notes"]];
  PROJECTS.forEach(p => {
    p.tasks.forEach(t => {
      rows.push([p.name, p.priority, t[0], t[1], statusLabel(t[2]), t[3]]);
    });
  });
  const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escXml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STATUS_COLOR = { done: "#01AA47", progress: "#B8860B", notstarted: "#C0392B" };

function chapterXhtml(p) {
  let cautionHtml = "";
  if (p.caution) {
    cautionHtml = `<div class="caution">&#9888; <strong>Caution:</strong> this group shows patterns commonly seen in advance-fee gold scams &#8212; pricing well below market rates, Proof of Product delayed repeatedly, shifting sellers/refineries, unusual bank-instrument verbiage. Verify independently before committing anything.</div>`;
  }
  const rows = p.tasks.map(t => {
    const [task, owner, status, note] = t;
    const color = STATUS_COLOR[status] || "#333";
    return `<tr><td>${escXml(task)}</td><td>${escXml(owner)}</td><td><span style="color:${color};font-weight:bold;">${escXml(statusLabel(status))}</span></td><td class="notes">${escXml(note)}</td></tr>`;
  }).join("\n");
  return `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>${escXml(p.name)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body>
<h1>${escXml(p.name)}</h1>
<p class="purpose">${escXml(p.purpose)}</p>
<p class="badge">Priority: <strong>${escXml(p.priority)}</strong></p>
${cautionHtml}
<table>
<thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Notes</th></tr></thead>
<tbody>
${rows}
</tbody>
</table>
</body>
</html>`;
}
